name: Mtandao - APK signé

# - À chaque envoi sur main : vérification du code (analyse + tests).
# - Sur une étiquette « v1.0.0 » ou à la main (onglet Actions > Run workflow) :
#   fabrication de l'APK, signé avec la clé enregistrée dans les secrets du dépôt.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Vérifier le code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse du code (les erreurs font échouer)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

  apk:
    name: Construire et signer l'APK
    needs: verifier
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # pour joindre l'APK à la « release » d'une étiquette
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Vérifier que la clé de signature est enregistrée
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::error title=Clé de signature absente::Ajoutez les secrets ANDROID_KEYSTORE_BASE64 et ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions). Voir le README, section « Signer l'application »."
            exit 1
          fi

      - name: Créer le projet Android (identifiant cd.mtandao)
        run: ./setup.sh

      - name: Installer la clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'mtandao' }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/mtandao-release.jks
          python3 - <<'PY'
          import os
          def esc(s):
              return s.replace('\\', '\\\\')
          with open('android/key.properties', 'w') as f:
              f.write('storePassword=%s\n' % esc(os.environ['STORE_PW']))
              f.write('keyPassword=%s\n' % esc(os.environ['KEY_PW']))
              f.write('keyAlias=%s\n' % os.environ['KEY_ALIAS'])
              f.write('storeFile=mtandao-release.jks\n')
          PY

      - name: Fabriquer l'APK
        run: |
          # Le numéro de build augmente tout seul à chaque exécution (Android l'exige).
          ARGS=(--release "--build-number=${GITHUB_RUN_NUMBER}")
          NOM=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NOM="${GITHUB_REF_NAME#v}"
            ARGS+=("--build-name=${NOM}")
          fi
          flutter build apk "${ARGS[@]}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Mtandao-${NOM:-build${GITHUB_RUN_NUMBER}}.apk"
          ls -l dist

      - name: Vérifier la signature
        run: |
          APKSIGNER="$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          APK="$(ls dist/*.apk | head -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          if grep -qi "Android Debug" signature.txt; then
            echo "::error title=APK mal signé::L'APK est signé avec la clé de test, pas avec votre clé."
            exit 1
          fi

      - name: Nettoyer la clé
        if: always()
        run: rm -f android/key.properties android/app/mtandao-release.jks

      - name: Garder l'APK (onglet de l'exécution, 30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: Mtandao-APK-signe
          path: dist/*.apk
          retention-days: 30

      - name: Publier dans les « Releases » (étiquettes v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
