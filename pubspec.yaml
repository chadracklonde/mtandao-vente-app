name: mtandao
description: Mtandao - gestion de la vente des tickets Wi-Fi, 100 % hors ligne.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0 <1.0.0'
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  pdfrx: ^2.0.0
  image: ^4.5.4
  zxing2: ^0.2.4
  crypto: ^3.0.6
  file_picker: ^10.3.8
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^17.0.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: '#0A8FD0'
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
